<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוח הכנסות יומי – רשת חוות דעת</title>
<link href="https://fonts.googleapis.com/css2?family=Ledger&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --orange:#F54B1E; --cream:#F5EBE1; --dark:#1E1928; --gray:#8C8282;
  --white:#fff; --bg:#F5EBE1; --border:#e0d4c8; --success:#5B8A6B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',sans-serif;background:var(--bg);color:var(--dark);direction:rtl;font-size:14px;min-height:100vh;}

/* HEADER */
.header{background:var(--dark);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.header-title{font-family:'Ledger',serif;font-size:22px;color:var(--white);}
.header-sub{font-size:12px;color:var(--gray);margin-top:2px;}
.header-badge{background:var(--orange);color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;}

/* CONTROLS */
.controls{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.ctrl-group{display:flex;flex-direction:column;gap:4px;}
.ctrl-group label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;}
.ctrl-group select, .ctrl-group input[type=date]{
  padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-family:'Archivo',sans-serif;font-size:13px;color:var(--dark);background:#fff;
  cursor:pointer;min-width:130px;
}
.ctrl-group select:focus, .ctrl-group input:focus{outline:none;border-color:var(--orange);}
.mode-btns{display:flex;gap:6px;margin-top:auto;}
.mode-btn{padding:7px 16px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--gray);transition:all .2s;}
.mode-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}
.ctrl-divider{width:1px;background:var(--border);margin:0 4px;align-self:stretch;}
.apply-btn{padding:8px 20px;background:var(--orange);color:#fff;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;margin-top:auto;transition:opacity .2s;}
.apply-btn:hover{opacity:.88;}

/* MAIN */
.main{padding:22px 28px;display:flex;flex-direction:column;gap:22px;}

/* KPI CARDS */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.kpi-card{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--border);position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange);}
.kpi-label{font-size:11px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.kpi-val{font-size:24px;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:11px;color:var(--gray);margin-top:4px;}
.kpi-card.accent::before{background:var(--success);}
.kpi-card.secondary::before{background:var(--dark);}

/* FILTER BAR */
.filter-bar{background:#fff;border-bottom:2px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-bar-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.filter-pills{display:flex;flex-wrap:wrap;gap:7px;flex:1;}
.filter-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;
  border:2px solid transparent;font-size:12px;font-weight:600;cursor:pointer;
  background:#f5f0ea;color:var(--gray);transition:all .18s;user-select:none;}
.filter-pill .pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.filter-pill.active{color:#fff;border-color:transparent;}
.filter-pill:hover{opacity:.82;}
.filter-quick{display:flex;gap:6px;margin-right:4px;}
.filter-quick button{padding:4px 13px;border-radius:16px;border:1.5px solid var(--border);
  background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:var(--gray);transition:all .15s;}
.filter-quick button:hover{border-color:var(--orange);color:var(--orange);}

/* CHARTS GRID */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.chart-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);}
.chart-card.full{grid-column:1/-1;}
.chart-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.chart-wrap{position:relative;height:240px;}
.chart-wrap.tall{height:300px;}

/* ENTRY PANEL */
.entry-panel{background:#fff;border-radius:12px;border:1.5px solid var(--orange);padding:20px 24px;}
.entry-title{font-size:14px;font-weight:700;color:var(--orange);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.entry-title svg{flex-shrink:0;}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.entry-field{display:flex;flex-direction:column;gap:5px;}
.entry-field label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;}
.entry-field input, .entry-field select{
  padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;font-family:'Archivo',sans-serif;color:var(--dark);
}
.entry-field input:focus, .entry-field select:focus{outline:none;border-color:var(--orange);}
.entry-actions{display:flex;gap:10px;margin-top:14px;align-items:center;}
.save-btn{padding:9px 24px;background:var(--orange);color:#fff;border:none;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.save-btn:hover{opacity:.88;}
.clear-btn{padding:9px 18px;background:#fff;color:var(--gray);border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;cursor:pointer;}
.entry-msg{font-size:12px;padding:4px 12px;border-radius:6px;display:none;}
.entry-msg.ok{background:#e8f5e9;color:#2e7d32;display:block;}
.entry-msg.err{background:#fce4ec;color:#c62828;display:block;}

/* TABLE */
.table-card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;}
.table-header{padding:14px 18px;font-size:13px;font-weight:700;color:var(--dark);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.table-wrap{overflow-x:auto;}
.table-wrap table{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto;}
.table-wrap thead th{padding:9px 12px;background:var(--dark);color:#fff;font-weight:600;text-align:right;white-space:nowrap;font-size:11px;}
.table-wrap thead th:first-child{text-align:right;min-width:160px;}
.table-wrap tbody td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
.table-wrap tbody tr:hover{background:var(--bg);}
.table-wrap tbody tr.total-row{background:var(--bg);font-weight:700;}
.table-wrap tbody tr.branch-row{background:#fff5f2;}
.table-wrap tbody tr.section-header{background:var(--dark);color:#fff;}
.table-wrap tbody tr.section-header td{font-weight:700;font-size:11px;letter-spacing:.5px;color:#fff;}
.td-num{font-variant-numeric:tabular-nums;}
.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;}

/* TABS */
.tab-bar{display:flex;gap:6px;margin-bottom:2px;}
.tab{padding:7px 18px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;
  background:#f5f0ea;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray);}
.tab.active{background:#fff;color:var(--dark);}

/* ALERTS */
.info-bar{background:#fff3e0;border:1px solid #ffcc80;border-radius:8px;padding:10px 16px;
  font-size:12px;color:#e65100;display:flex;align-items:center;gap:8px;}

/* RESPONSIVE */
@media(max-width:768px){
  .charts-grid{grid-template-columns:1fr;}
  .chart-card.full{grid-column:1;}
  .controls{flex-direction:column;}
  .main{padding:14px;}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">דוח הכנסות יומי – רשת חוות דעת</div>
    <div class="header-sub">ללא מע"מ | ניתוח לפי יום / חודש / סניף / מחלקה</div>
  </div>
  <div class="header-badge" id="hdr-badge">טוען נתונים...</div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="ctrl-group">
    <label>תצוגה</label>
    <div class="mode-btns">
      <button class="mode-btn active" id="btn-branches" onclick="setMode('branches')">סניפים</button>
      <button class="mode-btn" id="btn-depts" onclick="setMode('depts')">מחלקות כ"ס</button>
    </div>
  </div>
  <div class="ctrl-divider"></div>
  <div class="ctrl-group">
    <label>מאתריך</label>
    <input type="date" id="date-from" onchange="onDateChange()">
  </div>
  <div class="ctrl-group">
    <label>עד תאריך</label>
    <input type="date" id="date-to" onchange="onDateChange()">
  </div>
  <div class="ctrl-divider"></div>
  <div class="ctrl-group">
    <label>גרנולריות</label>
    <select id="sel-granularity" onchange="render()">
      <option value="auto">אוטומטי</option>
      <option value="daily">יומי</option>
      <option value="monthly">חודשי</option>
    </select>
  </div>
  <div class="ctrl-divider"></div>
  <div class="ctrl-group">
    <label>סוג גרף מגמה</label>
    <div class="mode-btns">
      <button class="mode-btn" id="btn-line" onclick="setChartType('line')" title="קו חלק — מגמה ברורה">📈 קו</button>
      <button class="mode-btn active" id="btn-area" onclick="setChartType('area')" title="שטח — קו + מילוי">⛰ שטח</button>
      <button class="mode-btn" id="btn-bar" onclick="setChartType('bar')" title="עמודות — השוואה בין תקופות">📊 עמודות</button>
    </div>
  </div>
  <button class="apply-btn" onclick="render()">רענן</button>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <span class="filter-bar-label">סינון</span>
  <div class="filter-quick">
    <button onclick="selectAll()">הכל</button>
    <button onclick="selectNone()">נקה</button>
  </div>
  <div class="filter-pills" id="filter-pills"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="info-bar" class="info-bar" style="display:none">
    <span>⚡</span><span id="info-msg"></span>
  </div>

  <!-- KPI ROW -->
  <div class="kpi-row" id="kpi-row"></div>

  <!-- CHARTS -->
  <div class="charts-grid" id="charts-area"></div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-header">
      <span id="table-title">טבלת נתונים</span>
      <span id="table-sub" style="font-size:11px;color:var(--gray);font-weight:400;"></span>
    </div>
    <div class="table-wrap" id="table-wrap"></div>
  </div>

  <!-- DATA ENTRY -->
  <div class="entry-panel">
    <div class="entry-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      הזנת נתונים יומיים
    </div>
    <div class="entry-grid">
      <div class="entry-field">
        <label>תאריך</label>
        <input type="date" id="entry-date">
      </div>
      <div class="entry-field">
        <label>סניף / מחלקה</label>
        <select id="entry-entity"></select>
      </div>
      <div class="entry-field">
        <label>הכנסה (ללא מע"מ)</label>
        <input type="number" id="entry-amount" placeholder="0" min="0">
      </div>
    </div>
    <div class="entry-actions">
      <button class="save-btn" onclick="saveEntry()">שמור נתון</button>
      <button class="clear-btn" onclick="clearEntry()">נקה</button>
      <button class="clear-btn" onclick="clearTestData()" style="border-color:#c62828;color:#c62828;" title="מחק את כל נתוני הבדיקה וחזור לנתוני האקסל בלבד">🗑 נקה נתוני בדיקה</button>
      <span class="entry-msg" id="entry-msg"></span>
    </div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────────────────────
let STATE = {
  mode: 'branches', // 'branches' | 'depts'
  dateFrom: '2026-03-01',
  dateTo:   '2026-05-31',
  chartType: 'area',  // 'line' | 'area' | 'bar'
  selected: new Set(), // selected entity names for charts
};
let charts = {};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmt(n){ if(!n) return '—'; if(n>=1000000) return '₪'+(n/1000000).toFixed(2)+'M'; if(n>=1000) return '₪'+(n/1000).toFixed(1)+'K'; return '₪'+Math.round(n).toLocaleString('he'); }
function fmtN(n){ if(!n) return '—'; return '₪'+Math.round(n).toLocaleString('he-IL'); }
function parseDate(s){ const [y,m,d]=s.split('-'); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseDate(s); return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}); }
function fmtMonth(s){ const [y,m]=s.split('-'); const names=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר']; return names[parseInt(m)-1]+' '+y; }
function monthKey(s){ return s.slice(0,7); }
function daysBetween(from,to){ return Math.round((parseDate(to)-parseDate(from))/(1000*60*60*24))+1; }
function distinctMonths(from,to){
  const s=new Set(); let d=new Date(parseDate(from));
  while(d<=parseDate(to)){ s.add(d.toISOString().slice(0,7)); d.setDate(d.getDate()+1); }
  return [...s].sort();
}

function getEntityData(entity, from, to){
  // Returns {date: val} or {month: val} depending on granularity
  const raw = RAW[entity] || {};
  const result = {};
  for(const [dt, val] of Object.entries(raw)){
    if(dt >= from && dt <= to) result[dt] = val;
  }
  return result;
}

function aggregateByMonth(daily){
  const monthly = {};
  for(const [dt, val] of Object.entries(daily)){
    const mk = monthKey(dt);
    monthly[mk] = (monthly[mk]||0) + val;
  }
  return monthly;
}

function useMonthly(){
  const g = document.getElementById('sel-granularity').value;
  if(g==='daily') return false;
  if(g==='monthly') return true;
  // auto: monthly if > 62 days
  return daysBetween(STATE.dateFrom, STATE.dateTo) > 62;
}

// ── MODE ──────────────────────────────────────────────────────────────────────
function setMode(m){
  STATE.mode = m;
  document.getElementById('btn-branches').classList.toggle('active', m==='branches');
  document.getElementById('btn-depts').classList.toggle('active', m==='depts');
  buildFilterPills();
  render();
}

function setChartType(t){
  STATE.chartType = t;
  ['line','area','bar'].forEach(x => document.getElementById('btn-'+x)?.classList.toggle('active', x===t));
  render();
}

// ── FILTER PILLS ──────────────────────────────────────────────────────────────
function buildFilterPills(){
  const entities = STATE.mode === 'branches' ? BRANCHES : DEPTS_KS;
  // Reset selection to all on mode change
  STATE.selected = new Set(entities);
  const container = document.getElementById('filter-pills');
  container.innerHTML = '';
  for(const e of entities){
    const color = COLORS[e] || '#888';
    const pill = document.createElement('span');
    pill.className = 'filter-pill active';
    pill.dataset.name = e;
    pill.style.background = color;
    pill.style.borderColor = color;
    pill.innerHTML = `<span class="pill-dot" style="background:rgba(255,255,255,0.5)"></span>${e}`;
    pill.addEventListener('click', () => togglePill(e, pill, color));
    container.appendChild(pill);
  }
}

function togglePill(name, el, color){
  if(STATE.selected.has(name)){
    // Deselect — keep at least 1
    if(STATE.selected.size <= 1) return;
    STATE.selected.delete(name);
    el.classList.remove('active');
    el.style.background = '#f5f0ea';
    el.style.borderColor = color;
    el.style.color = color;
  } else {
    STATE.selected.add(name);
    el.classList.add('active');
    el.style.background = color;
    el.style.borderColor = color;
    el.style.color = '#fff';
  }
  render();
}

function selectAll(){
  const entities = STATE.mode === 'branches' ? BRANCHES : DEPTS_KS;
  STATE.selected = new Set(entities);
  document.querySelectorAll('.filter-pill').forEach(p => {
    const c = COLORS[p.dataset.name] || '#888';
    p.classList.add('active');
    p.style.background = c; p.style.borderColor = c; p.style.color = '#fff';
  });
  render();
}

function selectNone(){
  const entities = STATE.mode === 'branches' ? BRANCHES : DEPTS_KS;
  // Keep only first entity
  STATE.selected = new Set([entities[0]]);
  document.querySelectorAll('.filter-pill').forEach(p => {
    const c = COLORS[p.dataset.name] || '#888';
    if(p.dataset.name === entities[0]){
      p.classList.add('active');
      p.style.background = c; p.style.borderColor = c; p.style.color = '#fff';
    } else {
      p.classList.remove('active');
      p.style.background = '#f5f0ea'; p.style.borderColor = c; p.style.color = c;
    }
  });
  render();
}

// ── DATE CHANGE ───────────────────────────────────────────────────────────────
function onDateChange(){
  STATE.dateFrom = document.getElementById('date-from').value || STATE.dateFrom;
  STATE.dateTo   = document.getElementById('date-to').value   || STATE.dateTo;
  render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  document.getElementById('date-from').value = STATE.dateFrom;
  document.getElementById('date-to').value   = STATE.dateTo;

  // Populate entry entity select
  const sel = document.getElementById('entry-entity');
  sel.innerHTML = '';
  const addOpt = (v, g) => {
    const o = document.createElement('option');
    o.value=v; o.textContent=v;
    if(g){o.style.fontWeight='600';}
    sel.appendChild(o);
  };
  const og1 = document.createElement('optgroup'); og1.label='סניפים';
  BRANCHES.forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; og1.appendChild(o); });
  sel.appendChild(og1);
  const og2 = document.createElement('optgroup'); og2.label='מחלקות כפר סבא';
  DEPTS_KS.forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; og2.appendChild(o); });
  sel.appendChild(og2);

  // Set entry date to today or first available
  document.getElementById('entry-date').value = '2026-03-24';
  // Sync chart type buttons
  ['line','area','bar'].forEach(x => document.getElementById('btn-'+x)?.classList.toggle('active', x===STATE.chartType));

  buildFilterPills();
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  STATE.dateFrom = document.getElementById('date-from').value || STATE.dateFrom;
  STATE.dateTo   = document.getElementById('date-to').value   || STATE.dateTo;

  const allEntities = STATE.mode === 'branches' ? BRANCHES : DEPTS_KS;
  // Use selected filter (fallback to all if empty)
  const entities = allEntities.filter(e => STATE.selected.size === 0 || STATE.selected.has(e));
  const monthly  = useMonthly();
  const months   = distinctMonths(STATE.dateFrom, STATE.dateTo);

  // Info bar
  const infoBar = document.getElementById('info-bar');
  const infoMsg = document.getElementById('info-msg');
  if(monthly){
    infoBar.style.display='flex';
    infoMsg.textContent = `טווח גדול מ-2 חודשים — מציג השוואה חודשית (${months.length} חודשים)`;
  } else {
    infoBar.style.display='none';
  }

  // Badge
  const label = STATE.mode==='branches' ? 'השוואת סניפים' : 'מחלקות כפר סבא';
  document.getElementById('hdr-badge').textContent = label + ' | ' + (monthly?'חודשי':'יומי');

  // Gather data
  const allData = {};
  let totalRev = 0;
  let activeEntities = [];
  for(const e of entities){
    const daily = getEntityData(e, STATE.dateFrom, STATE.dateTo);
    const agg   = monthly ? aggregateByMonth(daily) : daily;
    const sum   = Object.values(agg).reduce((a,b)=>a+b, 0);
    allData[e]  = { daily, agg, sum };
    totalRev   += sum;
    if(sum>0) activeEntities.push(e);
  }

  renderKPIs(allData, entities, totalRev, monthly, months);
  renderCharts(allData, entities, monthly, months);
  renderTable(allData, entities, monthly, months);
}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function renderKPIs(allData, entities, totalRev, monthly, months){
  const topEntity = entities.slice().sort((a,b)=>allData[b].sum-allData[a].sum)[0];
  const activeCount = entities.filter(e=>allData[e].sum>0).length;
  const periods = monthly ? months.length : daysBetween(STATE.dateFrom, STATE.dateTo);
  const avgPerPeriod = periods > 0 ? totalRev / periods : 0;

  const html = `
    <div class="kpi-card">
      <div class="kpi-label">סה"כ הכנסות</div>
      <div class="kpi-val">${fmt(totalRev)}</div>
      <div class="kpi-sub">${STATE.dateFrom.split('-').reverse().join('/')} – ${STATE.dateTo.split('-').reverse().join('/')}</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">${monthly?'ממוצע חודשי':'ממוצע יומי'}</div>
      <div class="kpi-val">${fmt(avgPerPeriod)}</div>
      <div class="kpi-sub">${periods} ${monthly?'חודשים':'ימים'} בטווח</div>
    </div>
    <div class="kpi-card secondary">
      <div class="kpi-label">${STATE.mode==='branches'?'סניף מוביל':'מחלקה מובילה'}</div>
      <div class="kpi-val" style="font-size:16px;">${topEntity||'—'}</div>
      <div class="kpi-sub">${fmt(allData[topEntity]?.sum||0)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">פעילים בתקופה</div>
      <div class="kpi-val">${activeCount}</div>
      <div class="kpi-sub">מתוך ${entities.length} ${STATE.mode==='branches'?'סניפים':'מחלקות'}</div>
    </div>
  `;
  document.getElementById('kpi-row').innerHTML = html;
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
function destroyAll(){
  for(const k of Object.keys(charts)){ try{charts[k].destroy();}catch(e){} }
  charts = {};
}

function renderCharts(allData, entities, monthly, months){
  destroyAll();
  const area = document.getElementById('charts-area');
  area.innerHTML = '';

  // Prepare labels
  let labels;
  if(monthly){
    labels = months;
  } else {
    // daily labels in range
    const lbls = [];
    let d = parseDate(STATE.dateFrom);
    while(d <= parseDate(STATE.dateTo)){ lbls.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
    labels = lbls;
  }

  // Chart 1: Trend — line / area / bar based on STATE.chartType
  const ct = STATE.chartType;
  const isBar = ct === 'bar';
  const isLine = ct === 'line';
  const isArea = ct === 'area';

  const trendCard = document.createElement('div');
  trendCard.className = 'chart-card full';
  const trendSubtitle = isBar ? 'השוואת עמודות בין תקופות' : isLine ? 'קו מגמה נקי לכל ישות' : 'שטח מגמה עם מילוי';
  trendCard.innerHTML = `
    <div class="chart-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>מגמת הכנסות לאורך זמן</span>
      <span style="font-size:11px;color:var(--gray);font-weight:400;">${trendSubtitle}</span>
    </div>
    <div class="chart-wrap" style="height:320px"><canvas id="ch-trend"></canvas></div>`;
  area.appendChild(trendCard);

  // Also add a "total" line when in line/area mode — helpful for CEO overview
  const totalVals = labels.map(l => entities.reduce((s,e)=>s+(allData[e].agg[l]||0),0));

  let trendDs;
  if(isBar){
    trendDs = entities.map(e => ({
      label: e,
      data: labels.map(l => allData[e].agg[l] || 0),
      backgroundColor: hexAlpha(COLORS[e]||'#888', 0.8),
      borderColor: COLORS[e]||'#888',
      borderWidth: 1,
      borderRadius: 3,
    }));
  } else {
    // Line or Area: one line per entity + dashed total line
    trendDs = entities.map((e,i) => ({
      label: e,
      data: labels.map(l => allData[e].agg[l] || null), // null = gap (no fake zeros)
      borderColor: COLORS[e]||'#888',
      backgroundColor: isArea ? hexAlpha(COLORS[e]||'#888', 0.12) : 'transparent',
      borderWidth: 2.5,
      pointRadius: labels.length > 60 ? 0 : 3,
      pointHoverRadius: 5,
      tension: 0.35,
      fill: isArea,
      spanGaps: false,
    }));
    // Add bold total line on top
    trendDs.push({
      label: 'סה"כ רשת',
      data: totalVals,
      borderColor: '#F54B1E',
      backgroundColor: 'transparent',
      borderWidth: 3,
      borderDash: [6,3],
      pointRadius: labels.length > 60 ? 0 : 4,
      pointHoverRadius: 6,
      tension: 0.3,
      fill: false,
      order: -1,
    });
  }

  charts['trend'] = new Chart(document.getElementById('ch-trend'), {
    type: isBar ? 'bar' : 'line',
    data: { labels: labels.map(l => monthly ? fmtMonth(l) : fmtDate(l)), datasets: trendDs },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position:'bottom', rtl:true, labels:{ font:{size:11}, boxWidth:12, usePointStyle: !isBar } },
        tooltip: {
          rtl: true,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.raw!=null ? fmt(ctx.raw) : '—'}`,
            footer: isBar ? ctx => `סה"כ: ${fmt(ctx.reduce((s,c)=>s+(c.raw||0),0))}` : undefined,
          }
        }
      },
      scales: {
        x: {
          stacked: isBar,
          ticks: { font:{size:10}, maxRotation: labels.length>31 ? 45 : 0, autoSkip:true, maxTicksLimit: monthly?12:31 },
          grid: { color:'#f5f0ea' }
        },
        y: {
          stacked: isBar,
          ticks: { callback: v=>fmt(v), font:{size:11} },
          grid: { color:'#f0ece6' },
          beginAtZero: true,
        }
      }
    }
  });

  // Chart 2: Pie – share by entity for total period
  const pieCard = document.createElement('div');
  pieCard.className = 'chart-card';
  pieCard.innerHTML = `<div class="chart-title">חלוקת הכנסות לפי ${STATE.mode==='branches'?'סניף':'מחלקה'}</div><div class="chart-wrap"><canvas id="ch-pie"></canvas></div>`;
  area.appendChild(pieCard);

  const pieEntities = entities.filter(e=>allData[e].sum>0);
  charts['pie'] = new Chart(document.getElementById('ch-pie'), {
    type: 'doughnut',
    data: { labels: pieEntities, datasets:[{ data: pieEntities.map(e=>allData[e].sum), backgroundColor: pieEntities.map(e=>COLORS[e]||'#888'), borderWidth:2, borderColor:'#fff' }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',rtl:true,labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)}`}}} }
  });

  // Chart 3: Horizontal bar – ranking
  const rankCard = document.createElement('div');
  rankCard.className = 'chart-card';
  rankCard.innerHTML = `<div class="chart-title">דירוג ${STATE.mode==='branches'?'סניפים':'מחלקות'} בתקופה</div><div class="chart-wrap"><canvas id="ch-rank"></canvas></div>`;
  area.appendChild(rankCard);

  const ranked = [...entities].sort((a,b)=>allData[b].sum-allData[a].sum);
  charts['rank'] = new Chart(document.getElementById('ch-rank'), {
    type: 'bar',
    data: { labels: ranked, datasets:[{ data: ranked.map(e=>allData[e].sum), backgroundColor: ranked.map(e=>COLORS[e]||'#888'), borderRadius:4 }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmt(ctx.raw)}`}}}, scales:{ x:{ticks:{callback:v=>fmt(v)},grid:{color:'#f0ece6'}}, y:{ticks:{font:{size:11}}} } }
  });
}

function hexAlpha(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable(allData, entities, monthly, months){
  let labels;
  if(monthly){
    labels = months;
  } else {
    const lbls = [];
    let d = parseDate(STATE.dateFrom);
    while(d <= parseDate(STATE.dateTo)){ lbls.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
    labels = lbls;
  }

  const title = monthly ? 'השוואה חודשית' : 'נתונים יומיים';
  document.getElementById('table-title').textContent = title;
  document.getElementById('table-sub').textContent = `${labels.length} תקופות | ${entities.length} ${STATE.mode==='branches'?'סניפים':'מחלקות'}`;

  // Table: rows = entities, cols = dates/months
  let html = '<table><thead><tr><th>שם</th>';
  for(const l of labels) html += `<th>${monthly ? fmtMonth(l) : fmtDate(l)}</th>`;
  html += '<th>סה"כ</th></tr></thead><tbody>';

  for(const e of entities){
    const isTotal = false;
    html += `<tr class="${STATE.mode==='branches'?'branch-row':''}"><td><span class="badge-dot" style="background:${COLORS[e]||'#888'}"></span>${e}</td>`;
    for(const l of labels){
      const val = allData[e].agg[l] || 0;
      html += `<td class="td-num">${val ? fmtN(val) : '<span style="color:#ccc">—</span>'}</td>`;
    }
    html += `<td class="td-num" style="font-weight:700">${allData[e].sum ? fmtN(allData[e].sum) : '—'}</td></tr>`;
  }

  // Total row
  const totalByLabel = {};
  for(const l of labels){ totalByLabel[l] = entities.reduce((s,e)=>(s+(allData[e].agg[l]||0)),0); }
  const grandTotal = entities.reduce((s,e)=>s+allData[e].sum,0);
  html += `<tr class="total-row"><td>סה"כ</td>`;
  for(const l of labels) html += `<td class="td-num">${totalByLabel[l] ? fmtN(totalByLabel[l]) : '—'}</td>`;
  html += `<td class="td-num">${fmtN(grandTotal)}</td></tr>`;

  html += '</tbody></table>';
  document.getElementById('table-wrap').innerHTML = html;
}

// ── ENTRY ─────────────────────────────────────────────────────────────────────
function saveEntry(){
  const dt     = document.getElementById('entry-date').value;
  const entity = document.getElementById('entry-entity').value;
  const amount = parseFloat(document.getElementById('entry-amount').value);
  const msg    = document.getElementById('entry-msg');

  if(!dt || !entity || isNaN(amount) || amount < 0){
    msg.className = 'entry-msg err';
    msg.textContent = '⚠ נא למלא תאריך, שם ישות וסכום תקין';
    return;
  }

  if(!RAW[entity]) RAW[entity] = {};
  RAW[entity][dt] = amount;

  msg.className = 'entry-msg ok';
  msg.textContent = `✓ נשמר: ${entity} | ${dt.split('-').reverse().join('/')} | ${fmtN(amount)}`;

  // Auto-update date range to include new date
  if(dt < STATE.dateFrom || dt > STATE.dateTo){
    const newFrom = dt < STATE.dateFrom ? dt : STATE.dateFrom;
    const newTo   = dt > STATE.dateTo   ? dt : STATE.dateTo;
    STATE.dateFrom = newFrom;
    STATE.dateTo   = newTo;
    document.getElementById('date-from').value = newFrom;
    document.getElementById('date-to').value   = newTo;
  }

  render();
  setTimeout(()=>{ msg.className='entry-msg'; msg.textContent=''; }, 4000);
}

function clearEntry(){
  document.getElementById('entry-amount').value = '';
  document.getElementById('entry-msg').className = 'entry-msg';
  document.getElementById('entry-msg').textContent = '';
}
