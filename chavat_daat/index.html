<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ממשק מנהל – חוות דעת</title>
<link href="https://fonts.googleapis.com/css2?family=Ledger&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Archivo', Calibri, sans-serif;
    background: #1E1928;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .logo-wrap {
    margin-bottom: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* SVG logo */
  .logo-svg {
    width: 110px;
    height: 110px;
  }

  .title {
    font-family: 'Ledger', Georgia, serif;
    font-size: 28px;
    letter-spacing: 0.5px;
    color: #fff;
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: #8C8282;
    text-align: center;
    margin-bottom: 48px;
    letter-spacing: 0.3px;
  }

  .cards {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 620px;
  }

  .card {
    background: #2A2338;
    border: 1.5px solid #3A3248;
    border-radius: 16px;
    padding: 32px 36px;
    flex: 1;
    min-width: 220px;
    max-width: 280px;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #F54B1E;
    box-shadow: 0 8px 32px rgba(245, 75, 30, 0.18);
  }

  .card-icon {
    width: 52px;
    height: 52px;
    background: #F54B1E;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .card-label {
    font-family: 'Ledger', Georgia, serif;
    font-size: 17px;
    text-align: center;
    line-height: 1.4;
  }

  .card-desc {
    font-size: 12px;
    color: #8C8282;
    text-align: center;
    line-height: 1.5;
  }

  .card-arrow {
    font-size: 18px;
    color: #F54B1E;
    margin-top: 4px;
  }

  footer {
    margin-top: 56px;
    font-size: 11px;
    color: #4A4258;
    text-align: center;
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <!-- Recreated חוות דעת logo as inline SVG -->
  <svg class="logo-svg" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="55" cy="55" r="52" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <!-- Animal head / horns -->
    <path d="M28 48 Q22 34 30 30 Q36 27 38 38" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M82 48 Q88 34 80 30 Q74 27 72 38" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Head outline -->
    <ellipse cx="55" cy="58" rx="27" ry="23" stroke="white" stroke-width="2.5" fill="none"/>
    <!-- Eye -->
    <ellipse cx="55" cy="56" rx="11" ry="8" stroke="white" stroke-width="2" fill="none"/>
    <circle cx="55" cy="56" r="4" fill="white"/>
    <circle cx="57" cy="54" r="1.2" fill="#1E1928"/>
    <!-- Ears -->
    <ellipse cx="30" cy="50" rx="5" ry="7" stroke="white" stroke-width="2" fill="none"/>
    <ellipse cx="80" cy="50" rx="5" ry="7" stroke="white" stroke-width="2" fill="none"/>
    <!-- Nose -->
    <ellipse cx="55" cy="70" rx="8" ry="5" stroke="white" stroke-width="2" fill="none"/>
    <circle cx="52" cy="70" r="1.5" fill="white"/>
    <circle cx="58" cy="70" r="1.5" fill="white"/>
  </svg>
</div>

<h1 class="title">ממשק מנהל חוות דעת</h1>
<p class="subtitle">בחר דשבורד לצפייה</p>

<div class="cards">

  <a class="card" href="dashboard_ceo.html">
    <div class="card-icon">🌐</div>
    <div class="card-label">דשבורד מצטבר</div>
    <div class="card-desc">סקירת רשת כוללת · השוואת סניפים · KPI מנכ״ל</div>
    <div class="card-arrow">←</div>
  </a>

  <a class="card" href="dashboard_ks.html">
    <div class="card-icon">🏥</div>
    <div class="card-label">דשבורד כפר סבא</div>
    <div class="card-desc">פירוט מחלקתי · השוואת חודשים · ניתוח רבעוני</div>
    <div class="card-arrow">←</div>
  </a>

</div>

<footer>חוות דעת © 2025 · כל הזכויות שמורות</footer>

</body>
</html>
