<title>ממשק מנהל – חוות דעת</title>
<link href="https://fonts.googleapis.com/css2?family=Ledger&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Archivo', Calibri, sans-serif;
    background: #1E1928;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .logo-wrap {
    margin-bottom: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* SVG logo */
  .logo-svg {
    width: 80px;
    height: auto;
  }

  .title {
    font-family: 'Ledger', Georgia, serif;
    font-size: 28px;
    letter-spacing: 0.5px;
    color: #fff;
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: #8C8282;
    text-align: center;
    margin-bottom: 48px;
    letter-spacing: 0.3px;
  }

  .cards {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 620px;
  }

  .card {
    background: #2A2338;
    border: 1.5px solid #3A3248;
    border-radius: 16px;
    padding: 32px 36px;
    flex: 1;
    min-width: 220px;
    max-width: 280px;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #F54B1E;
    box-shadow: 0 8px 32px rgba(245, 75, 30, 0.18);
  }

  .card-icon {
    width: 52px;
    height: 52px;
    background: #F54B1E;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .card-label {
    font-family: 'Ledger', Georgia, serif;
    font-size: 17px;
    text-align: center;
    line-height: 1.4;
  }

  .card-desc {
    font-size: 12px;
    color: #8C8282;
    text-align: center;
    line-height: 1.5;
  }

  .card-arrow {
    font-size: 18px;
    color: #F54B1E;
    margin-top: 4px;
  }

  footer {
    margin-top: 56px;
    font-size: 11px;
    color: #4A4258;
    text-align: center;
  }
</style>
</head>
